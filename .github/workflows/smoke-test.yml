name: smoke-test
on: [push]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tulis hasil
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ render route OK" > hasil.txt
          cat hasil.txt
      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: hasil.txt
